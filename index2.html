<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Video and Image</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <!-- Parallax Video Section -->
    <section class="video-section">
        <video autoplay muted loop playsinline class="parallax-video">
            <source src="okav.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        
        <div class="content">
            <h1>Welcome to Parallax Video</h1>
        </div>
    </section>

    <!-- Normal Content Section -->
    <section class="normal-section">
        <h2>About Us</h2>
        <p>This is standard scrolling content between parallax layers.</p>
    </section>

    <!-- Parallax Image Section -->
    <section class="image-section">
        <div class="parallax-img"></div>
        <div class="content">
            <h2>Parallax Image Effect</h2>
        </div>
    </section>

</body>
</html>
